<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Sticker Sheet Studio</title>
  <desc id="desc">A square sticker sheet with two labels, one missing label, and one label with a triangular peeled corner.</desc>
  <rect width="128" height="128" rx="20" fill="#6f1d35"/>
  <rect x="18" y="21" width="92" height="92" rx="7" fill="#3c0d1d" opacity=".24"/>
  <rect x="18" y="18" width="92" height="92" rx="7" fill="#fffafb" stroke="#e4d6db" stroke-width="3"/>

  <!-- Intact labels on one diagonal. -->
  <rect x="29" y="29" width="31" height="31" rx="4" fill="#8d2945"/>
  <rect x="68" y="68" width="31" height="31" rx="4" fill="#a93b58"/>

  <!-- The empty cut line marks a removed label. -->
  <rect x="68" y="29" width="31" height="31" rx="4" fill="none" stroke="#cdb9c0" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 4.5"/>

  <!-- The final sticker has a lower corner lifted into a triangular fold. -->
  <path d="M33 68h23a4 4 0 0 1 4 4v15L48 99H33a4 4 0 0 1-4-4V72a4 4 0 0 1 4-4Z" fill="#d9687f"/>
  <path d="M49 100 61 88H49Z" fill="#54152a" opacity=".25"/>
  <path d="M48 99 60 87H48Z" fill="#f8e9ee" stroke="#a93b58" stroke-width="1.5" stroke-linejoin="round"/>
</svg>